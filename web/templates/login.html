<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 - QQ 聊天记录分析</title>
    <script>
        // 与 base.html 一致：首次绘制前确定主题，避免闪屏
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) { /* 忽略 */ }
            if (saved !== 'light' && saved !== 'dark') {
                saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
                    ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', saved);
        })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container" style="max-width: 380px; margin-top: 15vh;">
        <div class="card">
            <div class="card-body p-4">
                <h4 class="text-center mb-2">QQ 聊天分析</h4>
                <p class="text-center text-muted small mb-4">此实例已启用访问口令</p>
                {% if error %}
                <div class="alert alert-danger py-2">{{ error }}</div>
                {% endif %}
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label" for="password">访问口令</label>
                        <input type="password" class="form-control" id="password" name="password" autofocus required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">登录</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
