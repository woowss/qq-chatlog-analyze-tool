{% extends "base.html" %}
{% block title %}话题趋势{% endblock %}
{% block content %}
<h2 class="page-title">话题趋势</h2>

{% if not api_ok %}
<div class="alert alert-warning">未配置 API Key，无法运行 AI 分析；本地统计功能不受影响。</div>
{% endif %}

<div class="card mb-4">
    <div class="card-header">话题分布</div>
    <div class="card-body">
        <div id="topicsChart" style="height: 400px;"></div>
    </div>
</div>

<div class="card mb-4">
    <div class="card-header">逐月话题摘要</div>
    <div class="card-body" id="topicsDetails">
        <p class="text-muted text-center">尚无分析结果。回到仪表盘运行「话题趋势」后，结果会显示在这里。</p>
    </div>
</div>

<script>
$(function() {
    loadAnalysis('topics', function(data) {
        if (data) renderTopicsCharts(data);
    });
});
</script>
{% endblock %}
