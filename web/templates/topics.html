{% extends "base.html" %}
{% block title %}话题趋势{% endblock %}
{% block content %}
<h2 class="page-title">话题趋势</h2>

{% if not api_ok %}
<div class="alert alert-warning">未配置 API Key，无法运行 AI 分析；本地统计功能不受影响。</div>
{% endif %}

{% if api_ok %}
<div class="card mb-4">
    <div class="card-body d-flex align-items-center gap-3 flex-wrap">
        <button class="btn btn-primary" id="inPageAnalyze" data-orig="运行话题趋势分析">运行话题趋势分析</button>
        <div class="form-check mb-0">
            <input class="form-check-input" type="checkbox" id="inPageRefresh">
            <label class="form-check-label small text-muted" for="inPageRefresh">强制重新分析（忽略缓存，会产生 API 费用）</label>
        </div>
        <div id="inPageStatus" class="ms-auto" role="status" aria-live="polite"></div>
    </div>
</div>
{% endif %}

<div class="card mb-4">
    <div class="card-header">话题分布</div>
    <div class="card-body">
        <div id="topicsChart" style="height: 400px;"></div>
    </div>
</div>

<div class="card mb-4">
    <div class="card-header">逐月话题摘要</div>
    <div class="card-body" id="topicsDetails">
        <p class="text-muted text-center">尚无分析结果。{% if api_ok %}点上方「运行话题趋势分析」，{% else %}配置 API Key 后，{% endif %}结果会显示在这里。</p>
    </div>
</div>

<script>
$(function() {
    loadAnalysis('topics', function(data) {
        if (data) renderTopicsCharts(data);
    });
    analyzeInPage('topics', renderTopicsCharts);
});
</script>
{% endblock %}
