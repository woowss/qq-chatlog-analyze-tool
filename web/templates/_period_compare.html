<section class="card mb-4" id="periodCompare" data-mode="{{ 'group' if is_group_chat else 'private' }}">
    <div class="card-header">两个时段对比 <small class="text-muted">本地计算，不调用模型</small></div>
    <div class="card-body">
        <p class="small text-muted">日期按 UTC+8 计算，首尾日期均包含；日均以自然日数为分母。区间外消息不参与回复和会话统计。</p>
        <div class="row g-3">
            {% for key, label in [('a', '时段 A'), ('b', '时段 B')] %}
            <div class="col-md-6">
                <fieldset class="border rounded p-3 h-100">
                    <legend class="float-none w-auto px-1 fs-6 mb-2">{{ label }}</legend>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label small" for="period{{ key|upper }}From">开始日期</label>
                            <input class="form-control form-control-sm" type="date" id="period{{ key|upper }}From" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small" for="period{{ key|upper }}To">结束日期</label>
                            <input class="form-control form-control-sm" type="date" id="period{{ key|upper }}To" required>
                        </div>
                    </div>
                </fieldset>
            </div>
            {% endfor %}
        </div>
        <button class="btn btn-outline-primary btn-sm mt-3" id="comparePeriods" type="button">比较时段</button>
        <div class="mt-3" id="periodCompareResult" aria-live="polite"></div>
    </div>
</section>
