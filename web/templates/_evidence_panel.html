<section class="card mb-4 d-none" id="evidencePanel" aria-labelledby="evidenceTitle">
    <div class="card-header" id="evidenceTitle">原文证据核对</div>
    <div class="card-body">
        <p class="small text-muted">来源核验在本机完成，不产生 API 费用。找到原文仅表示来源可定位，不能证明模型推断成立。</p>
        <div id="evidenceList" aria-live="polite"></div>
    </div>
</section>
<dialog class="context-dialog" id="evidenceDialog" aria-labelledby="evidenceDialogTitle">
    <div class="context-dialog-header">
        <h3 id="evidenceDialogTitle">证据原文与前后文</h3>
        <button class="btn btn-outline-secondary btn-sm" id="evidenceClose" type="button">关闭</button>
    </div>
    <div class="context-dialog-body msg-list" id="evidenceContext" aria-live="polite"></div>
</dialog>
