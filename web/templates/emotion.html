{% extends "base.html" %}
{% block title %}情绪分析{% endblock %}
{% block content %}
<h2 class="page-title">情绪分析</h2>

{% if not api_ok %}
<div class="alert alert-warning">未配置 API Key，无法运行 AI 分析；本地统计功能不受影响。</div>
{% endif %}

<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">情绪强度变化</div>
            <div class="card-body">
                <div id="emotionLineChart" style="height: 400px;"></div>
            </div>
        </div>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-header">{{ overview.self_name }} 情绪分布</div>
            <div class="card-body">
                <div id="selfEmotionPie" style="height: 300px;"></div>
            </div>
        </div>
    </div>
    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-header">{{ overview.other_name }} 情绪分布</div>
            <div class="card-body">
                <div id="otherEmotionPie" style="height: 300px;"></div>
            </div>
        </div>
    </div>
</div>

<div class="card mb-4">
    <div class="card-header">逐月情绪详情</div>
    <div class="card-body" id="emotionDetails">
        <p class="text-muted text-center">尚无分析结果。回到仪表盘运行「情绪分析」后，结果会显示在这里。</p>
    </div>
</div>

<script>
$(function() {
    loadAnalysis('emotion', function(data) {
        if (data) renderEmotionCharts(data);
    });
});
</script>
{% endblock %}
