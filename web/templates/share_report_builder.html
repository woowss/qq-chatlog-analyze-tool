{% extends "base.html" %}
{% block title %}制作分享报告{% endblock %}
{% block chart_scripts %}{% endblock %}
{% block analyze_scripts %}{% endblock %}

{% block content %}
<h2 class="page-title">制作脱敏分享副本</h2>
<p class="text-muted small">调整选项后先生成预览；下载与打印使用同一份预览 HTML。原始聊天、统计缓存与 AI 缓存不会被修改。</p>
<div class="card mb-3">
    <div class="card-header">隐藏内容</div>
    <div class="card-body">
        <div class="row g-2">
            <div class="col-md-6"><label class="form-check"><input class="form-check-input share-option" type="checkbox" name="hide_nicknames" checked><span class="form-check-label">隐藏昵称，按成员身份替换为稳定化名</span></label></div>
            <div class="col-md-6"><label class="form-check"><input class="form-check-input share-option" type="checkbox" name="hide_accounts" checked><span class="form-check-label">隐藏成员 UID 与连续数字账号；原文中的其他格式请检查预览</span></label></div>
            <div class="col-md-6"><label class="form-check"><input class="form-check-input share-option" type="checkbox" name="hide_original_text" checked><span class="form-check-label">隐藏原文；取消后最多纳入 20 条消息摘录</span></label></div>
            <div class="col-md-6"><label class="form-check"><input class="form-check-input share-option" type="checkbox" name="hide_exact_dates" checked><span class="form-check-label">隐藏精确日期，只按月份汇总</span></label></div>
            <div class="col-md-6"><label class="form-check"><input class="form-check-input share-option" type="checkbox" name="hide_statistics" checked><span class="form-check-label">隐藏统计数字，并移除相应图表、表格和矩阵数据</span></label></div>
        </div>
        <button class="btn btn-primary btn-sm mt-3" id="buildSharePreview" type="button">生成预览</button>
        <span id="shareStatus" class="small ms-2" aria-live="polite"></span>
        <div id="shareWarnings" class="mt-3"></div>
    </div>
</div>
<div class="d-flex gap-2 mb-2">
    <button class="btn btn-outline-primary btn-sm" id="downloadShare" type="button" disabled>下载分享 HTML</button>
    <button class="btn btn-outline-secondary btn-sm" id="printShare" type="button" disabled>打印 / 导出 PDF</button>
    <a class="btn btn-link btn-sm" href="{{ url_for('report') }}">返回完整报告</a>
</div>
<iframe id="sharePreview" class="share-preview" title="脱敏分享报告预览" sandbox="allow-same-origin allow-modals" style="width:100%;height:min(80vh,1100px);border:1px solid var(--border);border-radius:var(--radius-sm)" srcdoc="<!doctype html><html lang='zh-CN'><meta charset='utf-8'><body>生成预览后会显示分享副本。</body></html>"></iframe>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var html = '';
    var frame = document.getElementById('sharePreview');
    var requestVersion = 0;
    var placeholder = "<!doctype html><html lang='zh-CN'><meta charset='utf-8'><body>预览已清除；请使用当前选项重新生成。</body></html>";
    function options() {
        var out = {};
        document.querySelectorAll('.share-option').forEach(function(input) { out[input.name] = input.checked; });
        return out;
    }
    function clearPreview(message) {
        requestVersion++;
        html = '';
        frame.srcdoc = placeholder;
        $('#downloadShare, #printShare').prop('disabled', true);
        $('#shareWarnings').empty();
        $('#buildSharePreview').prop('disabled', false).text('生成预览');
        if (message) $('#shareStatus').text(message);
    }
    $('.share-option').on('change', function() { clearPreview('选项已变化，请重新生成预览。'); });
    $('#buildSharePreview').on('click', function() {
        var requestId = ++requestVersion;
        var button = $(this).prop('disabled', true).text('正在生成…');
        html = '';
        frame.srcdoc = placeholder;
        $('#downloadShare, #printShare').prop('disabled', true);
        $('#shareWarnings').empty();
        $('#shareStatus').text('正在生成脱敏副本…');
        $.ajax({url: '/api/report/share', method: 'POST', contentType: 'application/json', data: JSON.stringify({options: options()})})
            .done(function(result) {
                if (requestId !== requestVersion) return;
                html = result.html || '';
                frame.srcdoc = html;
                $('#downloadShare, #printShare').prop('disabled', !html);
                $('#shareStatus').text('预览已生成。请检查下方内容后再下载或打印。');
                var warnings = (result.warnings || []).map(function(note) {
                    return $('<div>').addClass('alert alert-info small py-2 mb-2').text(note);
                });
                $('#shareWarnings').empty().append(warnings);
            }).fail(function(xhr) {
                if (requestId !== requestVersion) return;
                $('#shareStatus').text((xhr.responseJSON && xhr.responseJSON.error) || '预览生成失败，请刷新后重试。');
                $('#shareWarnings').empty();
            }).always(function() {
                if (requestId === requestVersion) button.prop('disabled', false).text('生成预览');
            });
    });
    $('#downloadShare').on('click', function() {
        if (!html) return;
        var url = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
        var link = document.createElement('a');
        link.href = url;
        link.download = '聊天分析分享报告.html';
        link.click();
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    });
    $('#printShare').on('click', function() {
        if (!html || !frame.contentWindow) return;
        frame.contentWindow.focus();
        frame.contentWindow.print();
    });
})();
</script>
{% endblock %}
