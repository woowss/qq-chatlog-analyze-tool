# ===========================================================================
# 构建与打包：`pip install .` 装好后可直接用 `qqchatlog` 命令启动
# ===========================================================================
[build-system]
# setuptools>=77 才能用 PEP 639 的 license 表达式与 license-files
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qqchatlog"
version = "1.2.0"
description = "QQ 聊天记录分析工具：本地统计 + OpenAI 兼容接口的对话分析（私聊与群聊导出）"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "woowss" }]
keywords = ["qq", "chatlog", "analysis", "flask", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
# 运行期依赖：与 requirements.txt 同一批包。那边是给 CI/开发用的精确锁定（含传递依赖），
# 这里是给 pip 解析用的范围；上下限调整时两处都要动。
dependencies = [
    "Flask>=3.1,<4",
    "Flask-Session>=0.8,<0.9",
    # 会话后端：把 FileSystemCache 实例交给 SESSION_CACHELIB（原因见 app.py 里那段注释）
    "cachelib>=0.13,<0.15",
    "openai>=1.61,<2",
    "jieba>=0.42,<0.43",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# 开发/CI 用：`pip install -e ".[dev]"`
dev = ["ruff==0.16.6"]

[project.scripts]
# 命令行入口。app:main 只负责启动横幅 + 校验 + app.run，
# 真正的组装在 create_app()，`python app.py` 与 `flask --app app run` 仍然可用。
qqchatlog = "app:main"

[tool.setuptools]
# 扁平布局：顶层两个单文件模块 + 三个代码包 + web（只承载模板与静态资源的数据包）
py-modules = ["app", "config"]
packages = ["analyzer", "parser", "webapp", "web"]
include-package-data = true

[tool.setuptools.package-data]
# 模板与前端静态资源必须进 wheel：它们不在 .py 里，setuptools 默认不收。
# 少了这段，安装后 Flask 找不到 templates/static，页面直接 500。
# web/static 里有本地化的 Bootstrap/jQuery/ECharts（vendor/），必须 ** 递归。
# 覆盖范围由 tests/test_packaging.py 逐个文件核对（含"新增文件忘了改这里"的防线）。
web = ["templates/**/*.html", "static/**/*"]

# ===========================================================================
# 测试发现：CI 跑的是 `python -m unittest discover -s tests`（见 .github/workflows），
# 但本地和各种自动化工具的肌肉记忆是裸 `pytest`。缺这一段时 pytest 从仓库根递归收集，
# 把 temp/reversal/** 下那 26 份"把已修 bug 反向改回去"的整仓副本一起收进来——
# 它们的模块基名（test_core.py 等）与 tests/ 完全相同，于是 `python -m pytest`
# 报出 620 个收集错误。症状看着像"测试套件坏了"，真相只是没人告诉它只跑 tests/。
# 写死 testpaths，让两种跑法得到同一套用例（temp/ 已在 .gitignore 里，ruff 同理）。
# ===========================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["temp", "_audit", "dist", "build", "node_modules", ".*", "*.egg-info"]

# ===========================================================================
# 代码检查配置：CI 与本地都用 `ruff check .`
# ===========================================================================
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "ai_cache",
    "stats_cache",
    "uploads",
    "flask_session",
    "logs",
    ".env",
    # 早期设计文档（README 已注明内容过时）：ruff format 会连 Markdown 里 ```python 示例代码
    # 一起重排，给历史文档做格式化只制造噪音。注意：对 .md 这类非 Python 文件，
    # [tool.ruff.format] exclude 不生效，必须放在这一层。
    "docs",
]

[tool.ruff.lint]
# E/F/W 是基础项；B（bugbear）与 C4（comprehension）专抓"看起来没问题"的逻辑坑，
# 例如 zip 长度不匹配、可变默认参数、循环里做无用功——本次审查里
# "zip 两个长度不同的列表"就是这么暴露出来的。
select = ["E", "F", "W", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# 提示词是长中文文本，按列宽折行只会降低可读性且可能改变模型输入
"analyzer/prompts.py" = ["E501"]
"analyzer/group_prompts.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
# 提示词文件保持手工排版：它的可读性靠"一段一行"的隐式拼接，格式化会把它改成带括号的 + 链
# （字符串内容不变，但 diff 全是噪音）。lint 侧同样只给它 E501 豁免。
exclude = ["analyzer/prompts.py"]
