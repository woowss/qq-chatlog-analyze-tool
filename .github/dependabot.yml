# 依赖更新：本项目是本地单机工具，依赖固定在 requirements.txt 里，
# 靠人工定期 `pip list --outdated` 很容易忘。这里让 Dependabot 每周开 PR，
# 小版本合并成一个 PR（噪音低），大版本单独开（要逐个验证 API 变化）。
#
# pip 生态会同时读 requirements.txt 与 pyproject.toml 的 [project] dependencies，
# 两处都要跟着改（范围写 pyproject、精确锁定写 requirements.txt）；
# tests/test_packaging.py 会核对"声明的运行期依赖都被 requirements.txt 钉住"。
#
# 注意：web/static/vendor/ 里的 Bootstrap / jQuery / ECharts 是手工本地化的静态快照，
# Dependabot 没有对应的包清单可跟踪——升级它们要手动替换文件并同步
# web/templates/report.html 里的 VENDOR_CDN 版本号（见 test_review_fixes 的映射表用例）。
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # openai 的 major 明确不看：本项目只用 1.x 的接口形态（见 deepseek_client 的
    # 重试/思考模式参数），而 Dependabot 开 major PR 时会顺手把 pyproject.toml 里的
    # `openai>=1.61,<2` 放宽成 `<4`（2026-09 的 3.11.0 PR 就是这样）。越权放宽自己
    # 写的版本上限，比漏掉一次更新危险得多，所以这里显式忽略 major。
    ignore:
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
