name: release

# 打 tag（vX.Y.Z）就自动：校验版本一致 → 跑测试 → 构建 wheel/sdist → **发布** Release 并挂附件。
#
# 为什么要有这个 workflow：此前 Release 附件是维护者在本机手工构建上传的，
# 第三方无法证明"附件与 tag 源码一致"——资产页的 sha256 只能证明下载没坏。
# 改成 CI 从该 tag 构建后，任何人都能用同一 tag 复现同样的产物（见 README 的校验说明）。
#
# 为什么不再留草稿：草稿的附件只有有权限的人能下载，而 README 的安装链接指向
# `/releases/download/<tag>/…`——留草稿等于把一个下不到东西的链接发出去（实测踩过：
# 发布页只剩下 GitHub 自动生成的两个源码包，wheel 根本没挂上去）。人工关口保留在
# "要不要打这个 tag"这一步；发布说明由 tag 源码与 CI 决定，不需要二次确认。
#
# 为什么还要 workflow_dispatch：tag 推送**只**在"这个 tag 第一次被推送"时才走到
# `missing` 分支；已发布版本的附件按下面的规矩不许被自动覆盖（README 的安装链接与
# sha256 都指向那一批产物）。但当发布物本身需要重做（例如历史脱敏后要重新出包，
# 且已确认模型可见内容一字未变）时，得有一条**明示**的重建通道——那就是手动触发：
#   Actions → release → Run workflow → 填 tag（如 v1.1.3）
# 手动触发时才允许 `--clobber` 覆盖已发布附件并刷新说明里的 sha256；
# 自动（tag 推送）路径遇到"已发布"依然大声失败。
#
# 刻意不使用第三方 release action：只用 actions/* 与 runner 自带的 gh，
# 少一个供应链环节少一份风险。也不需要任何自定义 secret（用内置 GITHUB_TOKEN）。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重建附件的 tag（必须已存在，例如 v1.1.3）'
        required: true
        type: string

permissions:
  contents: write        # 建 Release 与上传附件所需

jobs:
  windows-package:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: 校验 Windows 构建版本
        shell: pwsh
        run: |
          $tag = $env:TAG.TrimStart('v')
          $project = Get-Content -Raw pyproject.toml
          $match = [regex]::Match($project, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success -or $match.Groups[1].Value -ne $tag) {
            throw "tag $env:TAG 与 pyproject.toml 版本不一致"
          }

      - name: 构建 Windows 安装包
        shell: pwsh
        run: |
          & .\packaging\windows\build.ps1 `
            -Python python `
            -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if ($LASTEXITCODE -ne 0) {
            throw "Windows 安装包构建失败"
          }

      - name: 校验冻结目录
        shell: pwsh
        run: python tools/verify_windows_package.py dist/windows/QQChatLog

      - name: Windows 启动器回归与冻结入口检查
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_windows_launcher.py -v
          if ($LASTEXITCODE -ne 0) { throw "Windows 启动器测试失败" }
          $env:QQCHAT_DATA_DIR = Join-Path $env:RUNNER_TEMP 'qqchatlog-version-smoke'
          $exe = (Resolve-Path 'dist/windows/QQChatLog/QQChatLog.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--version' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "冻结程序版本入口失败" }

      - name: 保存 Windows 发布物
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
          if-no-files-found: error

  release:
    needs: windows-package
    runs-on: ubuntu-latest
    env:
      # tag 推送时用被推的 tag；手动触发时用输入值
      TAG: ${{ inputs.tag || github.ref_name }}
      # 手动触发 = 明示的重建；只有这种情形才允许覆盖已发布附件
      REBUILD: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 确认目标 tag 存在
        run: |
          echo "目标 tag: $TAG（手动重建=$REBUILD）"
          git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null \
            || { echo "::error::tag $TAG 不存在"; exit 1; }

      # tag 与 pyproject 版本不一致时直接失败：否则会发出一个"名字叫 1.2.0、
      # 内容却是 1.1.0"的 Release，事后很难发现
      - name: 校验 tag 与 pyproject 版本一致
        run: |
          tag="${TAG#v}"
          case "$tag" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $TAG 不是 vX.Y.Z 形式"; exit 1 ;;
          esac
          ver="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $TAG 与 pyproject 版本 $ver 不一致"; exit 1
          fi
          echo "版本一致: $ver"

      # tag 推送不会触发 tests workflow（它只跑 branches: [main]），
      # 所以在发布链路里自己跑一遍全量测试，避免在没跑过测试的 commit 上发版
      - name: 安装依赖并跑全量测试
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests -q

      - name: 构建 wheel 与 sdist
        run: |
          pip install build
          python -m build --outdir .tmp_dist
          python tools/verify_wheel.py .tmp_dist/*.whl
          ls -l .tmp_dist

      - name: 下载 Windows 发布物
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: .tmp_windows_dist

      - name: 合并 Windows 发布物
        run: cp .tmp_windows_dist/* .tmp_dist/

      - name: 生成校验和
        run: |
          cd .tmp_dist
          sha256sum *.whl *.tar.gz *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 建 Release 并挂附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "本页附件由 CI（\`.github/workflows/release.yml\`）从 tag \`$TAG\` 的源码构建，"
            echo "因此任何人都可以用同一 tag 复现，而不是维护者本机手工上传。"
            echo
            echo '### 校验和（sha256）'
            echo
            echo '```'
            cat .tmp_dist/SHA256SUMS.txt
            echo '```'
            echo
            echo '### 安装 / 升级'
            echo
            echo '```bash'
            echo "pip install https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/qqchatlog-${TAG#v}-py3-none-any.whl"
            echo '```'
            echo
            echo 'Windows 用户可下载 `QQChatLog-<版本>-windows-x64-Setup.exe`，安装后双击桌面快捷方式即可运行；'
            echo '同时提供 `QQChatLog-<版本>-windows-x64-portable.zip` 免安装版本。'
            echo
            echo '### 隐私说明'
            echo
            echo '本地统计完全在本机完成；AI 分析会把聊天文本片段（可选含图片）发送到**你自己配置**的 LLM 接口，不配置 API Key 即纯本地、零外流。发布物中不含聊天记录、密钥或缓存。详见 README「隐私与数据生命周期」。'
            echo
            echo '完整变更见 `CHANGELOG.md`。'
          } > notes.md
          # 幂等 + 不覆盖已发布版本：
          #   · 没有 Release      → 直接建**已发布**的 Release（草稿对使用者不可见，
          #                        附件也下不到，见文件头说明）
          #   · 草稿（上一版遗留）→ 更新说明并覆盖附件，随后由下面的 --draft=false 发布
          #   · 已发布 + 手动触发 → 明示重建：刷新说明并覆盖附件（sha256 会随之更新）
          #   · 已发布 + tag 推送 → 大声失败。绝不悄悄替换已发布版本的二进制：
          #     README 的安装链接与说明里的 sha256 都指向那一批产物，静默替换等于让
          #     所有已下载/已校验过的人对不上账。要重建就手动触发本 workflow。
          state="$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          case "$state" in
            missing)
              gh release create "$TAG" \
                --title "$TAG" \
                --notes-file notes.md
              ;;
            true)
              gh release edit "$TAG" --notes-file notes.md
              ;;
            *)
              if [ "$REBUILD" = "true" ]; then
                echo "::notice::手动重建 $TAG：覆盖已发布附件并刷新校验和"
                gh release edit "$TAG" --notes-file notes.md
              else
                echo "::error::Release $TAG 已发布，tag 推送不覆盖已发布版本的附件。"
                echo "若确实要重建：在 Actions 页面手动运行 release workflow 并填 tag。"
                exit 1
              fi
              ;;
          esac
          gh release upload "$TAG" \
            .tmp_dist/*.whl .tmp_dist/*.tar.gz .tmp_dist/*.exe .tmp_dist/*.zip \
            .tmp_dist/SHA256SUMS.txt --clobber
          # 兜底：上一版遗留的草稿（或本次误建）在这里发布出去。附件已经挂好，
          # 这一步失败就说明发布页对使用者仍不可用，宁可让 job 红。
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json isDraft,assets \
            -q '"draft=\(.isDraft) assets=\(.assets | length)"'
