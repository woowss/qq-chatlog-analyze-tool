name: release

# 打 tag（vX.Y.Z）就自动：校验版本一致 → 跑测试 → 构建 wheel/sdist → 挂到 Release **草稿**。
#
# 为什么要有这个 workflow：此前 Release 附件是维护者在本机手工构建上传的，
# 第三方无法证明"附件与 tag 源码一致"——资产页的 sha256 只能证明下载没坏。
# 改成 CI 从该 tag 构建后，任何人都能用同一 tag 复现同样的产物（见 README 的校验说明）。
# 仍保留人工关口：默认建**草稿**，说明与"是否发布"由人确认后再点 Publish。
#
# 刻意不使用第三方 release action：只用 actions/* 与 runner 自带的 gh，
# 少一个供应链环节少一份风险。也不需要任何自定义 secret（用内置 GITHUB_TOKEN）。
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write        # 建 Release 与上传附件所需

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # tag 与 pyproject 版本不一致时直接失败：否则会发出一个"名字叫 1.2.0、
      # 内容却是 1.1.0"的 Release，事后很难发现
      - name: 校验 tag 与 pyproject 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag $GITHUB_REF_NAME 不是 vX.Y.Z 形式"; exit 1 ;;
          esac
          ver="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 pyproject 版本 $ver 不一致"; exit 1
          fi
          echo "版本一致: $ver"

      # tag 推送不会触发 tests workflow（它只跑 branches: [main]），
      # 所以在发布链路里自己跑一遍全量测试，避免在没跑过测试的 commit 上发版
      - name: 安装依赖并跑全量测试
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests -q

      - name: 构建 wheel 与 sdist
        run: |
          pip install build
          python -m build --outdir .tmp_dist
          python tools/verify_wheel.py .tmp_dist/*.whl
          ls -l .tmp_dist

      - name: 生成校验和
        run: |
          cd .tmp_dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 建 Release 草稿并挂附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "本页附件由 CI（\`.github/workflows/release.yml\`）从 tag \`$GITHUB_REF_NAME\` 的源码构建，"
            echo "因此任何人都可以用同一 tag 复现，而不是维护者本机手工上传。"
            echo
            echo '### 校验和（sha256）'
            echo
            echo '```'
            cat .tmp_dist/SHA256SUMS.txt
            echo '```'
            echo
            echo '### 安装 / 升级'
            echo
            echo '```bash'
            echo "pip install https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/qqchatlog-${GITHUB_REF_NAME#v}-py3-none-any.whl"
            echo '```'
            echo
            echo '### 隐私说明'
            echo
            echo '本地统计完全在本机完成；AI 分析会把聊天文本片段（可选含图片）发送到**你自己配置**的 LLM 接口，不配置 API Key 即纯本地、零外流。发布物中不含聊天记录、密钥或缓存。详见 README「隐私与数据生命周期」。'
            echo
            echo '完整变更见 `CHANGELOG.md`。'
          } > notes.md
          # 幂等 + 不覆盖已发布版本：
          #   · 没有 Release      → 建草稿
          #   · 草稿（含重跑）    → 更新说明并覆盖附件
          #   · 已发布            → 大声失败。绝不悄悄替换已发布版本的二进制：
          #     README 的安装链接与说明里的 sha256 都指向那一批产物，静默替换等于让
          #     所有已下载/已校验过的人对不上账。要重建就先手动删 Release，或发新版本号。
          state="$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null || echo missing)"
          case "$state" in
            missing)
              gh release create "$GITHUB_REF_NAME" \
                --title "$GITHUB_REF_NAME" \
                --notes-file notes.md \
                --draft
              ;;
            true)
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
              ;;
            *)
              echo "::error::Release $GITHUB_REF_NAME 已发布，本 workflow 不覆盖已发布版本的附件。"
              echo "若确实要重建：先手动删除该 Release，或发一个新的版本号。"
              exit 1
              ;;
          esac
          gh release upload "$GITHUB_REF_NAME" \
            .tmp_dist/*.whl .tmp_dist/*.tar.gz .tmp_dist/SHA256SUMS.txt --clobber
